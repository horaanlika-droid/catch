name: tmp drive fetch
on:
  push:
    branches: [arena/c014fa3f-catch]
    paths: ['.github/workflows/tmp-drive-fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: Logo, id: 1BU98FcTX7pFfGoWr-ELMJZ_OJrPfvWv4, want: '' }
          - { n: Team, id: 1-uduGv3Byj5uoA1m25xqgMO2bA7F0PXF, want: '' }
          - { n: Interior, id: 13yOm7UYjoNt-NLIG5_TtE1FDtSobhqjT, want: '0001 0013 0015 0025 0026 0027 0031 0032 0034 0036' }
          - { n: Cocktails, id: 1Zw-61UqS7PSSjRjigcF7cOQKS0n5lSzI, want: '' }
          - { n: Classy, id: 1UTqJeVQ8FvKqEE2AL32Guv5emnfju-0L, want: '20251211_0012 20251211_0021 20251211_0045 Aviation Boulevardier Cosmopolitan Dry_Martini' }
          - { n: Vibe, id: 10JtQBTA8xXAYIXzTwF0FwEsm6HsCQv3T, want: '0150 0151 0157 0162 0168 0174 0182 0198 0208 0229' }
          - { n: Food, id: 1h5a5u7m9LYUhpbILTQORBVbHkhRyYC6T, want: '20260407_0003 20260407_0017 20260407_0021 20260407_0039 20260407_0041 20260407_0044 20260407_0057 20260407_0069 20260407_0073' }
    steps:
      - run: pip install -q gdown && sudo apt-get install -y imagemagick poppler-utils >/dev/null
      - name: download + process
        run: |
          O=$PWD/out/${{ matrix.n }}; mkdir -p $O /tmp/d; cd /tmp/d
          timeout 1100 gdown --folder "https://drive.google.com/drive/folders/${{ matrix.id }}" -O raw > $O/_log.txt 2>&1 || echo "FAIL/TIMEOUT $?" >> $O/_log.txt
          WANT="${{ matrix.want }}"
          find raw -type f | sort | while IFS= read -r f; do
            base=$(basename "$f"); stem="${base%.*}"; [[ "$base" == *.* ]] || stem="$base"
            slug=$(echo "$stem" | tr ' ' '_' | sed 's/\.$//')
            if [ -n "$WANT" ] && ! echo " $WANT " | grep -q " $slug "; then continue; fi
            mt=$(file -b --mime-type "$f"); n=0; out="$O/$slug"
            while [ -e "$out.jpg" ] || [ -e "$out.svg" ]; do n=$((n+1)); out="$O/${slug}_$n"; done
            case "$mt" in
              image/*)
                case "${{ matrix.n }}" in
                  Team) convert "$f[0]" -auto-orient -resize '1000x1250>' -strip -interlace Plane -quality 80 "$out.jpg";;
                  Cocktails|Classy) convert "$f[0]" -auto-orient -resize '1000x1000>' -strip -interlace Plane -quality 80 "$out.jpg";;
                  *) convert "$f[0]" -auto-orient -resize '1500x1500>' -strip -interlace Plane -quality 78 "$out.jpg";;
                esac;;
              application/pdf) pdftocairo -svg "$f" "$out.svg"; pdftoppm -png -r 200 -singlefile "$f" "$out";;
              *) echo "skip $f $mt" >> $O/_log.txt;;
            esac
          done
          ls -la $O
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "s2-${{ matrix.n }}", path: out }
  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/a, pattern: "s2-*", merge-multiple: true }
      - run: |
          mkdir -p _drive_stage2 && cp -r /tmp/a/* _drive_stage2/ || true
          git config user.name "drive-fetch-bot"; git config user.email "bot@users.noreply.github.com"
          git add _drive_stage2 && git commit -m "tmp: drive stage2" && git push origin HEAD:arena/c014fa3f-catch
